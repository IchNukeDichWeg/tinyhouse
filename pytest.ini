[pytest]
# A few proofs cost seconds, not milliseconds -- the draw proof below needs
# depth 100 and about 7s. They are opt-in so the routine gate stays fast:
#   pytest -q          the fast suite (this default)
#   pytest -q -m slow  only the slow proofs
#   pytest -q -m ""    everything
markers =
    slow: a multi-second proof; excluded from the default run
addopts = -m "not slow"
